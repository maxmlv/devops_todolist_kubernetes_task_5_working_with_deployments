apiVersion: v1
kind: Pod
metadata:
  name: todoapp-standalone
  namespace: mateapp
  labels:
    app: todoapp-standalone
spec:
  containers:
  - name: todoapp
    image: ikulyk404/todoapp:3.0.0
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
    ports:
    - containerPort: 8080
    livenessProbe:
      httpGet:
        path: /api/health
        port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5
    readinessProbe:
      httpGet:
        path: /api/ready
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
